<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Restaurant - Admin Panel</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-header">
            <h1>ReserveSpot Admin</h1>
            <div class="user-info" sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>
        <ul class="nav-tabs">
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/users}">Users</a></li>
            <li><a th:href="@{/admin/restaurants}" class="active">Restaurants</a></li>
            <li><a th:href="@{/admin/reservations}">Reservations</a></li>
            <li><a th:href="@{/admin/reviews}">Reviews</a></li>
            <li><a th:href="@{/admin/tags}">Tags</a></li>
            <li><a th:href="@{/admin/tables}">Tables</a></li>
            <li><a th:href="@{/admin/statistics}">Statistics</a></li>
            <li><a th:href="@{/admin/pictures}">Pictures</a></li>
            <li><a th:href="@{/admin/ai-analysis}">AI Analysis</a></li>
        </ul>
    </nav>

    <main class="admin-content">
        <div class="page-header">
            <h2>Create New Restaurant</h2>
            <a th:href="@{/admin/restaurants}" class="btn btn-secondary">Back to List</a>
        </div>

        <div class="form-container">
            <form th:action="@{/admin/restaurants/create}" th:object="${restaurant}" method="post" data-validate>
                <div class="form-group">
                    <label for="ownerId">Owner *</label>
                    <div class="autocomplete-container">
                        <input type="text" id="ownerSearch" placeholder="Search for owner..." autocomplete="off">
                        <input type="hidden" id="ownerId" th:field="*{ownerId}" required>
                    </div>
                    <div th:if="${#fields.hasErrors('ownerId')}" class="error" th:errors="*{ownerId}"></div>
                </div>

                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" th:field="*{name}" required>
                    <div th:if="${#fields.hasErrors('name')}" class="error" th:errors="*{name}"></div>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" th:field="*{address}">
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" th:field="*{city}">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="openingHours">Opening Hours (JSON format: {"monday": "9:00-21:00", ...})</label>
                    <textarea id="openingHours" th:field="*{openingHours}" rows="3" placeholder='{"monday": "9:00-21:00", "tuesday": "9:00-21:00"}'></textarea>
                </div>

                <div class="form-group">
                    <label for="latitude">Latitude</label>
                    <input type="number" id="latitude" th:field="*{latitude}" step="any">
                </div>

                <div class="form-group">
                    <label for="longitude">Longitude</label>
                    <input type="number" id="longitude" th:field="*{longitude}" step="any">
                </div>

                <div class="form-group">
                    <label for="pic">Picture URL</label>
                    <input type="url" id="pic" th:field="*{pic}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Create Restaurant</button>
                    <a th:href="@{/admin/restaurants}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script th:src="@{/js/admin.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAutocomplete('ownerSearch', '/admin/api/users/search', 'name', 'id');
        });
    </script>
</body>
</html>
