<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables - Admin Panel</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-header">
            <h1>ReserveSpot Admin</h1>
            <div class="user-info" sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>
        <ul class="nav-tabs">
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/users}">Users</a></li>
            <li><a th:href="@{/admin/restaurants}">Restaurants</a></li>
            <li><a th:href="@{/admin/reservations}">Reservations</a></li>
            <li><a th:href="@{/admin/reviews}">Reviews</a></li>
            <li><a th:href="@{/admin/tags}">Tags</a></li>
            <li><a th:href="@{/admin/tables}" class="active">Tables</a></li>
            <li><a th:href="@{/admin/statistics}">Statistics</a></li>
            <li><a th:href="@{/admin/pictures}">Pictures</a></li>
            <li><a th:href="@{/admin/ai-analysis}">AI Analysis</a></li>
        </ul>
    </nav>

    <main class="admin-content">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <div class="page-header">
            <h2>Tables</h2>
            <a th:href="@{/admin/tables/create}" class="btn btn-primary">Create New Table</a>
        </div>

        <div class="filters">
            <form method="get" th:action="@{/admin/tables}">
                <div class="filter-group">
                    <label>Restaurant ID</label>
                    <input type="number" name="restaurantId" th:value="${restaurantId}" placeholder="Filter by restaurant">
                </div>
                <div class="filter-group">
                    <label>Min Capacity</label>
                    <input type="number" name="minCapacity" th:value="${minCapacity}" min="1" placeholder="Min capacity">
                </div>
                <div class="filter-group">
                    <button type="submit" class="btn btn-primary">Filter</button>
                    <a th:href="@{/admin/tables}" class="btn btn-secondary">Reset</a>
                </div>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="sortable" data-sort="id">ID</th>
                        <th>Restaurant</th>
                        <th class="sortable" data-sort="tableNumber">Table #</th>
                        <th class="sortable" data-sort="capacity">Capacity</th>
                        <th>Location</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${tables.isEmpty()}">
                        <td colspan="6" style="text-align: center; padding: 2rem;">No tables found</td>
                    </tr>
                    <tr th:each="table : ${tables}">
                        <td th:text="${table.id}"></td>
                        <td>
                            <a th:if="${table.restaurantId != null}"
                               th:href="@{/admin/restaurants/{id}(id=${table.restaurantId})}" 
                               class="relation-link" 
                               th:text="${table.restaurantId}"></a>
                            <span th:if="${table.restaurantId == null}">-</span>
                        </td>
                        <td th:text="${table.tableNumber ?: '-'}"></td>
                        <td th:text="${table.capacity ?: '-'}"></td>
                        <td th:text="${table.locationInRestaurant ?: '-'}"></td>
                        <td class="actions">
                            <a th:href="@{/admin/tables/{id}(id=${table.id})}" class="btn btn-sm btn-secondary">View</a>
                            <a th:href="@{/admin/tables/{id}/edit(id=${table.id})}" class="btn btn-sm btn-primary">Edit</a>
                            <form th:action="@{/admin/tables/{id}/delete(id=${table.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-danger btn-delete">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 0}" 
               th:href="@{/admin/tables(page=${currentPage - 1}, size=${pageSize}, sortBy=${sortBy != null ? sortBy : 'id'}, sortDir=${sortDir != null ? sortDir : 'asc'}, restaurantId=${restaurantId != null ? restaurantId : ''}, minCapacity=${minCapacity != null ? minCapacity : ''})}">Previous</a>
            <span th:each="page : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:if="${page != currentPage}"
                   th:href="@{/admin/tables(page=${page}, size=${pageSize}, sortBy=${sortBy != null ? sortBy : 'id'}, sortDir=${sortDir != null ? sortDir : 'asc'}, restaurantId=${restaurantId != null ? restaurantId : ''}, minCapacity=${minCapacity != null ? minCapacity : ''})}"
                   th:text="${page + 1}"></a>
                <span th:if="${page == currentPage}" class="active" th:text="${page + 1}"></span>
            </span>
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/admin/tables(page=${currentPage + 1}, size=${pageSize}, sortBy=${sortBy != null ? sortBy : 'id'}, sortDir=${sortDir != null ? sortDir : 'asc'}, restaurantId=${restaurantId != null ? restaurantId : ''}, minCapacity=${minCapacity != null ? minCapacity : ''})}">Next</a>
        </div>
    </main>

    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
