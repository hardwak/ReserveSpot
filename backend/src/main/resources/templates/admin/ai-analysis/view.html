<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View AI Analysis - Admin Panel</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-header">
            <h1>ReserveSpot Admin</h1>
            <div class="user-info" sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>
        <ul class="nav-tabs">
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/users}">Users</a></li>
            <li><a th:href="@{/admin/restaurants}">Restaurants</a></li>
            <li><a th:href="@{/admin/reservations}">Reservations</a></li>
            <li><a th:href="@{/admin/reviews}">Reviews</a></li>
            <li><a th:href="@{/admin/tags}">Tags</a></li>
            <li><a th:href="@{/admin/tables}">Tables</a></li>
            <li><a th:href="@{/admin/statistics}">Statistics</a></li>
            <li><a th:href="@{/admin/pictures}">Pictures</a></li>
            <li><a th:href="@{/admin/ai-analysis}" class="active">AI Analysis</a></li>
        </ul>
    </nav>

    <main class="admin-content">
        <div class="page-header">
            <h2>AI Analysis Details</h2>
            <div style="display: flex; gap: 1rem;">
                <a th:href="@{/admin/ai-analysis/{id}/edit(id=${analysis.id})}" class="btn btn-primary">Edit</a>
                <form th:action="@{/admin/ai-analysis/{id}/delete(id=${analysis.id})}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-danger btn-delete">Delete</button>
                </form>
                <a th:href="@{/admin/ai-analysis}" class="btn btn-secondary">Back to List</a>
            </div>
        </div>

        <div class="view-container">
            <div class="view-field">
                <label>ID</label>
                <div class="value" th:text="${analysis.id}"></div>
            </div>

            <div class="view-field">
                <label>Restaurant</label>
                <div class="value">
                    <a th:if="${analysis.restaurantId != null}"
                       th:href="@{/admin/restaurants/{id}(id=${analysis.restaurantId})}" 
                       class="relation-link" 
                       th:text="${analysis.restaurantId}"></a>
                    <span th:if="${analysis.restaurantId == null}">-</span>
                </div>
            </div>

            <div class="view-field">
                <label>Summary Text</label>
                <div class="value" style="white-space: pre-wrap;" th:text="${analysis.summaryText ?: '-'}"></div>
            </div>

            <div class="view-field">
                <label>Sentiment Score</label>
                <div class="value">
                    <span th:if="${analysis.sentimentScore != null}" 
                          th:text="${#numbers.formatDecimal(analysis.sentimentScore, 1, 2)}"></span>
                    <span th:if="${analysis.sentimentScore == null}">-</span>
                </div>
            </div>

            <div class="view-field">
                <label>Last Updated</label>
                <div class="value" th:text="${analysis.lastUpdated != null ? (#temporals.format(analysis.lastUpdated, 'yyyy-MM-dd HH:mm')) : '-'}"></div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
