<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit AI Analysis - Admin Panel</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-header">
            <h1>ReserveSpot Admin</h1>
            <div class="user-info" sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>
        <ul class="nav-tabs">
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/users}">Users</a></li>
            <li><a th:href="@{/admin/restaurants}">Restaurants</a></li>
            <li><a th:href="@{/admin/reservations}">Reservations</a></li>
            <li><a th:href="@{/admin/reviews}">Reviews</a></li>
            <li><a th:href="@{/admin/tags}">Tags</a></li>
            <li><a th:href="@{/admin/tables}">Tables</a></li>
            <li><a th:href="@{/admin/statistics}">Statistics</a></li>
            <li><a th:href="@{/admin/pictures}">Pictures</a></li>
            <li><a th:href="@{/admin/ai-analysis}" class="active">AI Analysis</a></li>
        </ul>
    </nav>

    <main class="admin-content">
        <div class="page-header">
            <h2>Edit AI Analysis</h2>
            <a th:href="@{/admin/ai-analysis/{id}(id=${analysisId})}" class="btn btn-secondary">View</a>
            <a th:href="@{/admin/ai-analysis}" class="btn btn-secondary">Back to List</a>
        </div>

        <div class="form-container">
            <form th:action="@{/admin/ai-analysis/{id}/edit(id=${analysisId})}" th:object="${analysis}" method="post" data-validate>
                <div class="form-group">
                    <label for="summaryText">Summary Text</label>
                    <textarea id="summaryText" th:field="*{summaryText}" rows="6"></textarea>
                </div>

                <div class="form-group">
                    <label for="sentimentScore">Sentiment Score (-1 to 1)</label>
                    <input type="number" id="sentimentScore" th:field="*{sentimentScore}" step="0.01" min="-1" max="1">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update Analysis</button>
                    <a th:href="@{/admin/ai-analysis}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
