<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Statistic - Admin Panel</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-header">
            <h1>ReserveSpot Admin</h1>
            <div class="user-info" sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>
        <ul class="nav-tabs">
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/users}">Users</a></li>
            <li><a th:href="@{/admin/restaurants}">Restaurants</a></li>
            <li><a th:href="@{/admin/reservations}">Reservations</a></li>
            <li><a th:href="@{/admin/reviews}">Reviews</a></li>
            <li><a th:href="@{/admin/tags}">Tags</a></li>
            <li><a th:href="@{/admin/tables}">Tables</a></li>
            <li><a th:href="@{/admin/statistics}" class="active">Statistics</a></li>
            <li><a th:href="@{/admin/pictures}">Pictures</a></li>
            <li><a th:href="@{/admin/ai-analysis}">AI Analysis</a></li>
        </ul>
    </nav>

    <main class="admin-content">
        <div class="page-header">
            <h2>Create New Statistic</h2>
            <a th:href="@{/admin/statistics}" class="btn btn-secondary">Back to List</a>
        </div>

        <div class="form-container">
            <form th:action="@{/admin/statistics/create}" th:object="${statistic}" method="post" data-validate>
                <div class="form-group">
                    <label for="restaurantId">Restaurant *</label>
                    <select id="restaurantId" th:field="*{restaurantId}" required>
                        <option value="">Select Restaurant</option>
                        <option th:each="restaurant : ${restaurants}" 
                                th:value="${restaurant.id}" 
                                th:text="${restaurant.name}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('restaurantId')}" class="error" th:errors="*{restaurantId}"></div>
                </div>

                <div class="form-group">
                    <label for="hourOfDay">Hour of Day (0-23)</label>
                    <input type="number" id="hourOfDay" th:field="*{hourOfDay}" min="0" max="23">
                    <div th:if="${#fields.hasErrors('hourOfDay')}" class="error" th:errors="*{hourOfDay}"></div>
                </div>

                <div class="form-group">
                    <label for="averageOccupancy">Average Occupancy</label>
                    <input type="number" id="averageOccupancy" th:field="*{averageOccupancy}" step="0.01" min="0" max="1">
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" th:field="*{date}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Create Statistic</button>
                    <a th:href="@{/admin/statistics}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
