<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Review - Admin Panel</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-header">
            <h1>ReserveSpot Admin</h1>
            <div class="user-info" sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>
        <ul class="nav-tabs">
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/users}">Users</a></li>
            <li><a th:href="@{/admin/restaurants}">Restaurants</a></li>
            <li><a th:href="@{/admin/reservations}">Reservations</a></li>
            <li><a th:href="@{/admin/reviews}" class="active">Reviews</a></li>
            <li><a th:href="@{/admin/tags}">Tags</a></li>
            <li><a th:href="@{/admin/tables}">Tables</a></li>
            <li><a th:href="@{/admin/statistics}">Statistics</a></li>
            <li><a th:href="@{/admin/pictures}">Pictures</a></li>
            <li><a th:href="@{/admin/ai-analysis}">AI Analysis</a></li>
        </ul>
    </nav>

    <main class="admin-content">
        <div class="page-header">
            <h2>Review Details</h2>
            <div style="display: flex; gap: 1rem;">
                <a th:href="@{/admin/reviews/{id}/edit(id=${review.id})}" class="btn btn-primary">Edit</a>
                <form th:action="@{/admin/reviews/{id}/delete(id=${review.id})}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-danger btn-delete">Delete</button>
                </form>
                <a th:href="@{/admin/reviews}" class="btn btn-secondary">Back to List</a>
            </div>
        </div>

        <div class="view-container">
            <div class="view-field">
                <label>ID</label>
                <div class="value" th:text="${review.id}"></div>
            </div>

            <div class="view-field">
                <label>User</label>
                <div class="value">
                    <a th:if="${review.userId != null}"
                       th:href="@{/admin/users/{id}(id=${review.userId})}" 
                       class="relation-link" 
                       th:text="${review.userId}"></a>
                    <span th:if="${review.userId == null}">-</span>
                </div>
            </div>

            <div class="view-field">
                <label>Restaurant</label>
                <div class="value">
                    <a th:if="${review.restaurantId != null}"
                       th:href="@{/admin/restaurants/{id}(id=${review.restaurantId})}" 
                       class="relation-link" 
                       th:text="${review.restaurantId}"></a>
                    <span th:if="${review.restaurantId == null}">-</span>
                </div>
            </div>

            <div class="view-field">
                <label>Rating</label>
                <div class="value" th:text="${review.rating != null ? review.rating : '-'}"></div>
            </div>

            <div class="view-field">
                <label>Comment</label>
                <div class="value" th:text="${review.comment ?: '-'}"></div>
            </div>

            <div class="view-field">
                <label>Phone Number</label>
                <div class="value" th:text="${review.phoneNumber ?: '-'}"></div>
            </div>

            <div class="view-field">
                <label>Created At</label>
                <div class="value" th:text="${review.createdAt != null ? (#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm')) : '-'}"></div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
