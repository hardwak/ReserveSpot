<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Review - Admin Panel</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-header">
            <h1>ReserveSpot Admin</h1>
            <div class="user-info" sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>
        <ul class="nav-tabs">
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/users}">Users</a></li>
            <li><a th:href="@{/admin/restaurants}">Restaurants</a></li>
            <li><a th:href="@{/admin/reservations}">Reservations</a></li>
            <li><a th:href="@{/admin/reviews}" class="active">Reviews</a></li>
            <li><a th:href="@{/admin/tags}">Tags</a></li>
            <li><a th:href="@{/admin/tables}">Tables</a></li>
            <li><a th:href="@{/admin/statistics}">Statistics</a></li>
            <li><a th:href="@{/admin/pictures}">Pictures</a></li>
            <li><a th:href="@{/admin/ai-analysis}">AI Analysis</a></li>
        </ul>
    </nav>

    <main class="admin-content">
        <div class="page-header">
            <h2>Edit Review</h2>
            <a th:href="@{/admin/reviews/{id}(id=${reviewId})}" class="btn btn-secondary">View</a>
            <a th:href="@{/admin/reviews}" class="btn btn-secondary">Back to List</a>
        </div>

        <div class="form-container">
            <div th:if="${error}" class="alert alert-error" style="padding: 1rem; background-color: #fee; border: 1px solid #fcc; border-radius: 4px; margin-bottom: 1rem; color: #c00;">
                <strong>Error:</strong> <span th:text="${error}"></span>
            </div>
            <form th:action="@{/admin/reviews/{id}/edit(id=${reviewId})}" th:object="${review}" method="post" data-validate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-error" style="padding: 1rem; background-color: #fee; border: 1px solid #fcc; border-radius: 4px; margin-bottom: 1rem; color: #c00;">
                    <strong>Validation Errors:</strong>
                    <ul style="margin: 0.5rem 0 0 0; padding-left: 1.5rem;">
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                    </ul>
                </div>
                <div class="form-group">
                    <label for="rating">Rating</label>
                    <input type="number" id="rating" th:field="*{rating}" min="1" max="5">
                    <div th:if="${#fields.hasErrors('rating')}" class="error" th:errors="*{rating}"></div>
                </div>

                <div class="form-group">
                    <label for="comment">Comment</label>
                    <textarea id="comment" th:field="*{comment}" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="pic">Picture URL</label>
                    <input type="url" id="pic" th:field="*{pic}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update Review</button>
                    <a th:href="@{/admin/reviews}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
