<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations - Admin Panel</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-header">
            <h1>ReserveSpot Admin</h1>
            <div class="user-info" sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>
        <ul class="nav-tabs">
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/users}">Users</a></li>
            <li><a th:href="@{/admin/restaurants}">Restaurants</a></li>
            <li><a th:href="@{/admin/reservations}" class="active">Reservations</a></li>
            <li><a th:href="@{/admin/reviews}">Reviews</a></li>
            <li><a th:href="@{/admin/tags}">Tags</a></li>
            <li><a th:href="@{/admin/tables}">Tables</a></li>
            <li><a th:href="@{/admin/statistics}">Statistics</a></li>
            <li><a th:href="@{/admin/pictures}">Pictures</a></li>
            <li><a th:href="@{/admin/ai-analysis}">AI Analysis</a></li>
        </ul>
    </nav>

    <main class="admin-content">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <div class="page-header">
            <h2>Reservations</h2>
            <a th:href="@{/admin/reservations/create}" class="btn btn-primary">Create New Reservation</a>
        </div>

        <div class="filters">
            <form method="get" th:action="@{/admin/reservations}">
                <div class="filter-group">
                    <label>User ID</label>
                    <input type="number" name="userId" th:value="${userId}" placeholder="Filter by user">
                </div>
                <div class="filter-group">
                    <label>Table ID</label>
                    <input type="number" name="tableId" th:value="${tableId}" placeholder="Filter by table">
                </div>
                <div class="filter-group">
                    <label>Status</label>
                    <select name="statusFilter">
                        <option value="">All Statuses</option>
                        <option th:each="status : ${statuses}" 
                                th:value="${status}" 
                                th:text="${status}"
                                th:selected="${statusFilter == status}"></option>
                    </select>
                </div>
                <div class="filter-group">
                    <button type="submit" class="btn btn-primary">Filter</button>
                    <a th:href="@{/admin/reservations}" class="btn btn-secondary">Reset</a>
                </div>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="sortable" data-sort="id">ID</th>
                        <th class="sortable" data-sort="reservationDatetime">Date & Time</th>
                        <th>User</th>
                        <th>Table</th>
                        <th>Duration</th>
                        <th class="sortable" data-sort="status">Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${reservations.isEmpty()}">
                        <td colspan="7" style="text-align: center; padding: 2rem;">No reservations found</td>
                    </tr>
                    <tr th:each="reservation : ${reservations}">
                        <td th:text="${reservation.id}"></td>
                        <td th:text="${#temporals.format(reservation.reservationDatetime, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <a th:if="${reservation.userId != null}"
                               th:href="@{/admin/users/{id}(id=${reservation.userId})}" 
                               class="relation-link" 
                               th:text="${reservation.userId}"></a>
                            <span th:if="${reservation.userId == null}">-</span>
                        </td>
                        <td>
                            <a th:if="${reservation.tableId != null}"
                               th:href="@{/admin/tables/{id}(id=${reservation.tableId})}" 
                               class="relation-link" 
                               th:text="${reservation.tableId}"></a>
                            <span th:if="${reservation.tableId == null}">-</span>
                        </td>
                        <td th:text="${reservation.durationMinutes != null ? (reservation.durationMinutes + ' min') : '-'}"></td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${reservation.status == T(com.pwr_zpi.reservespotapi.entities.reservation.ReservationStatus).CANCELLED ? 'badge-danger' : 'badge-primary'}"
                                  th:text="${reservation.status}"></span>
                        </td>
                        <td class="actions">
                            <a th:href="@{/admin/reservations/{id}(id=${reservation.id})}" class="btn btn-sm btn-secondary">View</a>
                            <a th:href="@{/admin/reservations/{id}/edit(id=${reservation.id})}" class="btn btn-sm btn-primary">Edit</a>
                            <form th:action="@{/admin/reservations/{id}/delete(id=${reservation.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-danger btn-delete">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 0}" 
               th:href="@{/admin/reservations(page=${currentPage - 1}, size=${pageSize}, sortBy=${sortBy}, sortDir=${sortDir}, userId=${userId}, tableId=${tableId}, statusFilter=${statusFilter})}">Previous</a>
            <span th:each="page : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:if="${page != currentPage}"
                   th:href="@{/admin/reservations(page=${page}, size=${pageSize}, sortBy=${sortBy}, sortDir=${sortDir}, userId=${userId}, tableId=${tableId}, statusFilter=${statusFilter})}"
                   th:text="${page + 1}"></a>
                <span th:if="${page == currentPage}" class="active" th:text="${page + 1}"></span>
            </span>
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/admin/reservations(page=${currentPage + 1}, size=${pageSize}, sortBy=${sortBy}, sortDir=${sortDir}, userId=${userId}, tableId=${tableId}, statusFilter=${statusFilter})}">Next</a>
        </div>
    </main>

    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
