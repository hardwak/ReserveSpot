<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Reservation - Admin Panel</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-header">
            <h1>ReserveSpot Admin</h1>
            <div class="user-info" sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>
        <ul class="nav-tabs">
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/users}">Users</a></li>
            <li><a th:href="@{/admin/restaurants}">Restaurants</a></li>
            <li><a th:href="@{/admin/reservations}" class="active">Reservations</a></li>
            <li><a th:href="@{/admin/reviews}">Reviews</a></li>
            <li><a th:href="@{/admin/tags}">Tags</a></li>
            <li><a th:href="@{/admin/tables}">Tables</a></li>
            <li><a th:href="@{/admin/statistics}">Statistics</a></li>
            <li><a th:href="@{/admin/pictures}">Pictures</a></li>
            <li><a th:href="@{/admin/ai-analysis}">AI Analysis</a></li>
        </ul>
    </nav>

    <main class="admin-content">
        <div class="page-header">
            <h2>Create New Reservation</h2>
            <a th:href="@{/admin/reservations}" class="btn btn-secondary">Back to List</a>
        </div>

        <div class="form-container">
            <form th:action="@{/admin/reservations/create}" th:object="${reservation}" method="post" data-validate>
                <div class="form-group">
                    <label for="userId">User *</label>
                    <select id="userId" name="userId" required>
                        <option value="">Select User</option>
                        <option th:each="user : ${users}" 
                                th:value="${user.id}" 
                                th:text="${user.name} + ' (' + ${user.email} + ')'"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tableId">Table *</label>
                    <select id="tableId" th:field="*{tableId}" required>
                        <option value="">Select Table</option>
                        <option th:each="table : ${tables}" 
                                th:value="${table.id}" 
                                th:text="'Table #' + ${table.tableNumber} + ' - ' + ${table.restaurantId}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('tableId')}" class="error" th:errors="*{tableId}"></div>
                </div>

                <div class="form-group">
                    <label for="reservationDatetime">Date & Time *</label>
                    <input type="datetime-local" id="reservationDatetime" th:field="*{reservationDatetime}" required>
                    <div th:if="${#fields.hasErrors('reservationDatetime')}" class="error" th:errors="*{reservationDatetime}"></div>
                </div>

                <div class="form-group">
                    <label for="durationMinutes">Duration (minutes) *</label>
                    <input type="number" id="durationMinutes" th:field="*{durationMinutes}" min="15" required>
                    <div th:if="${#fields.hasErrors('durationMinutes')}" class="error" th:errors="*{durationMinutes}"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Create Reservation</button>
                    <a th:href="@{/admin/reservations}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
