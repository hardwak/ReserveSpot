<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Admin Panel</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="admin-nav">
        <div class="nav-header">
            <h1>ReserveSpot Admin</h1>
            <div class="user-info" sec:authorize="isAuthenticated()">
                <span sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>
        <ul class="nav-tabs">
            <li><a th:href="@{/admin}">Dashboard</a></li>
            <li><a th:href="@{/admin/users}" class="active">Users</a></li>
            <li><a th:href="@{/admin/restaurants}">Restaurants</a></li>
            <li><a th:href="@{/admin/reservations}">Reservations</a></li>
            <li><a th:href="@{/admin/reviews}">Reviews</a></li>
            <li><a th:href="@{/admin/tags}">Tags</a></li>
            <li><a th:href="@{/admin/tables}">Tables</a></li>
            <li><a th:href="@{/admin/statistics}">Statistics</a></li>
            <li><a th:href="@{/admin/pictures}">Pictures</a></li>
            <li><a th:href="@{/admin/ai-analysis}">AI Analysis</a></li>
        </ul>
    </nav>

    <main class="admin-content">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <div class="page-header">
            <h2>Users</h2>
            <a th:href="@{/admin/users/create}" class="btn btn-primary">Create New User</a>
        </div>

        <div class="filters">
            <form method="get" th:action="@{/admin/users}">
                <div class="filter-group">
                    <label>Search</label>
                    <input type="text" name="search" th:value="${search}" placeholder="Name, email, phone...">
                </div>
                <div class="filter-group">
                    <label>Role</label>
                    <select name="roleFilter">
                        <option value="">All Roles</option>
                        <option th:each="role : ${roles}" 
                                th:value="${role}" 
                                th:text="${role}"
                                th:selected="${roleFilter == role}"></option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Page Size</label>
                    <select name="size">
                        <option th:each="size : ${10, 25, 50, 100}" 
                                th:value="${size}" 
                                th:text="${size}"
                                th:selected="${pageSize == size}"></option>
                    </select>
                </div>
                <div class="filter-group">
                    <button type="submit" class="btn btn-primary">Filter</button>
                    <a th:href="@{/admin/users}" class="btn btn-secondary">Reset</a>
                </div>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="sortable" data-sort="id">ID</th>
                        <th class="sortable" data-sort="name">Name</th>
                        <th class="sortable" data-sort="email">Email</th>
                        <th>Phone</th>
                        <th class="sortable" data-sort="role">Role</th>
                        <th>Provider</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${users.isEmpty()}">
                        <td colspan="7" style="text-align: center; padding: 2rem;">No users found</td>
                    </tr>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td>
                            <a th:href="@{/admin/users/{id}(id=${user.id})}" 
                               class="relation-link" 
                               th:text="${user.name}"></a>
                        </td>
                        <td th:text="${user.email}"></td>
                        <td th:text="${user.phoneNumber ?: '-'}"></td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${user.role == T(com.pwr_zpi.reservespotapi.entities.users.Role).ADMIN ? 'badge-danger' : (user.role == T(com.pwr_zpi.reservespotapi.entities.users.Role).RESTAURANT ? 'badge-warning' : 'badge-primary')}"
                                  th:text="${user.role}"></span>
                        </td>
                        <td th:text="${user.provider ?: '-'}"></td>
                        <td class="actions">
                            <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-sm btn-secondary">View</a>
                            <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-primary">Edit</a>
                            <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-danger btn-delete">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 0}" 
               th:href="@{/admin/users(page=${currentPage - 1}, size=${pageSize}, sortBy=${sortBy}, sortDir=${sortDir}, search=${search}, roleFilter=${roleFilter})}">Previous</a>
            <span th:each="page : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:if="${page != currentPage}"
                   th:href="@{/admin/users(page=${page}, size=${pageSize}, sortBy=${sortBy}, sortDir=${sortDir}, search=${search}, roleFilter=${roleFilter})}"
                   th:text="${page + 1}"></a>
                <span th:if="${page == currentPage}" class="active" th:text="${page + 1}"></span>
            </span>
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/admin/users(page=${currentPage + 1}, size=${pageSize}, sortBy=${sortBy}, sortDir=${sortDir}, search=${search}, roleFilter=${roleFilter})}">Next</a>
        </div>

        <div style="margin-top: 1rem; color: #666;">
            Showing <span th:text="${totalItems}"></span> users
        </div>
    </main>

    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
