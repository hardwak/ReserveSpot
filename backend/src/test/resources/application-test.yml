spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        # Override JSONB column definition for H2
        globally_quoted_identifiers: false
  h2:
    console:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

# Environment variables for tests (using Spring property format)
ADMIN_USERNAME: rsadmin
ADMIN_PASSWORD: rsadmin
POSTGRES_USER: sa
POSTGRES_PASSWORD: ""
